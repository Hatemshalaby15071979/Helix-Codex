name: Secret scan

on:
  pull_request:
  push:
    branches: ["release/simulated-production-2026-11"]
  schedule:
    - cron: '13 3 * * 0'

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # Full-history scan on the weekly cron; diff-only scan on PRs/pushes.
          GITLEAKS_ARGS: ${{ github.event_name == 'schedule' && '--log-opts=--all' || '' }}
