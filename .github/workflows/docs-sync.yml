name: docs-sync

# Keep the visitor-facing status block in README.md / index.html current when a
# release ships. Trigger is release-only. Opens a PR for review; never commits
# straight to the default branch. (This repository currently has no release, so
# the engine is dormant until one is published.)
on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync docs status block
        uses: Hatemshalaby15071979/Hatemshalaby15071979/.github/actions/docs-sync@master
        with:
          profile: _docs_profile.json
