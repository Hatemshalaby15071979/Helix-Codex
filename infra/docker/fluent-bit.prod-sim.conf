# SIMULATION ONLY — local log sink for the prod-sim topology.
#
# Receives the container log stream over loopback and writes newline-delimited
# JSON to the helix_sim_logs volume. No external endpoint, no credentials.
[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info

[INPUT]
    Name         forward
    Listen       0.0.0.0
    Port         24224

[OUTPUT]
    Name         file
    Match        *
    Path         /logs
    File         prod-sim.log
    Format       plain
