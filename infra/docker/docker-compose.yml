# Helix Codex OS — local deployment profile (C8)
services:
  helix-api:
    image: helix-prime-api:${HELIX_API_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    command: >
      uvicorn server.app:create_app --factory --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      HELIX_ENV: local
      HELIX_DB_PATH: /data/control_plane/workflow.db
      HELIX_AUDIT_DB_PATH: /data/security/audit.db
      HELIX_HOST: "0.0.0.0"
      HELIX_SAMPLE_DATA_MODE: "false"
      HELIX_API_TOKEN: "${HELIX_API_TOKEN:?Set HELIX_API_TOKEN in the environment}"
      HELIX_API_TOKEN_ROLE: "${HELIX_API_TOKEN_ROLE:-sami}"
      HELIX_API_TOKEN_TENANT_ID: "${HELIX_API_TOKEN_TENANT_ID:?Set HELIX_API_TOKEN_TENANT_ID in the environment}"
      HELIX_API_TOKEN_CLIENT_ID: "${HELIX_API_TOKEN_CLIENT_ID:-}"
      HELIX_API_ALLOW_GLOBAL_OPERATOR: "false"
    volumes:
      - helix_data:/data
    restart: unless-stopped
    # Liveness probe: /healthz answers "is the process alive" without touching
    # storage, so a slow disk can never cause a restart loop. Readiness (can
    # this instance serve traffic: workflow store reachable plus audit store
    # present, readable, and chain-verified) is the separate GET /readyz
    # endpoint, which answers 503 while the ledger is unverifiable — gate
    # traffic and container health on /readyz.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  helix:
    profiles: ["diagnostic"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      HELIX_ENV: local
      HELIX_DB_PATH: /data/control_plane/workflow.db
      HELIX_AUDIT_DB_PATH: /data/security/audit.db
      # Never enable sample data in a production/local operational profile.
      HELIX_SAMPLE_DATA_MODE: "false"
      # auto chooses CUDA when visible, DirectML on Windows hosts where the
      # Ollama runtime exposes it, and CPU otherwise.
      HELIX_OLLAMA_ACCELERATOR: ${HELIX_OLLAMA_ACCELERATOR:-auto}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
    volumes:
      - helix_data:/data
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped

  # Ollama is an external local model runtime, not part of the deterministic
  # engine image. GPU flags are opt-in; the control plane remains CPU-safe.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
    # Uncomment on CUDA hosts. DirectML uses the host runtime path on Windows
    # and is configured via HELIX_OLLAMA_ACCELERATOR=directml.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    restart: unless-stopped

volumes:
  helix_data:
  ollama_data:
